<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UPMIP Lalitpur - उद्यान विभाग</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f2027;
    }
    /* यह सेटिंग Google की ऊपर वाली चेतावनी पट्टी को स्क्रीन के ऊपर छिपा देगी */
    iframe {
      position: fixed;
      top: -32px;
      left: 0;
      width: 100%;
      height: calc(100% + 32px);
      border: none;
    }
  </style>
</head>
<body>
  <iframe src="https://google.com" allow="camera; microphone; geolocation"></iframe>
</body>
</html>
